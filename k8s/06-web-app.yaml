apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: lab-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: web-app
        image: <TU_REGISTRY>/web-app:latest # ¡Actualizar con la URI del ECR o Docker Hub!
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-app
  namespace: lab-app
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: web-app
